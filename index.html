<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#B05A0C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Studio Ripasso</title>
<style>
  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { margin: 0; background: #e9e4d6; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; color: #3d2a14; }
  .app { max-width: 640px; margin: 0 auto; min-height: 100vh; background: #FBF6EA; display: flex; flex-direction: column; }
  #bar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--b, #FBF6EA); color: var(--bt, #3d2a14); position: sticky; top: 0; z-index: 5; min-height: 64px; }
  #bar.col { --bt: #fff; }
  #bar .t { flex: 1; font-size: 15px; font-weight: 800; line-height: 1.2; }
  #bar .logo { display: flex; align-items: center; gap: 10px; flex: 1; font-size: 21px; font-weight: 800; }
  #bar .logo i { width: 40px; height: 40px; border-radius: 12px; background: #B05A0C; display: flex; align-items: center; justify-content: center; }
  .ib { width: 44px; height: 44px; border-radius: 22px; border: 2px solid currentColor; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; }
  .ib svg { width: 22px; height: 22px; }
  main { flex: 1; padding: 6px 18px 18px; }
  h1 { font-size: 24px; margin: 6px 0 8px; line-height: 1.15; }
  p { line-height: 1.5; margin: 8px 0; }
  .lbl { font-size: 13px; font-weight: 800; letter-spacing: .5px; margin: 16px 0 8px; display: block; }
  .small { font-size: 13px; color: #5a4a36; }
  .err { color: #B3321F; font-weight: 700; }
  .okc { color: #2c6347; font-weight: 700; }
  .hidden { display: none !important; }
  .center { text-align: center; }
  .card { background: #fff; border: 2px solid #3d2a14; border-radius: 16px; padding: 16px; margin: 12px 0; }

  .mat { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .m { min-height: 52px; border-radius: 12px; border: 2px solid #3d2a14; border-top: 8px solid var(--c); background: #fff; color: #3d2a14; font-size: 13px; font-weight: 800; padding: 4px; cursor: pointer; font-family: inherit; }
  .m.on { border-top-width: 2px; border-color: color-mix(in srgb, var(--c) 70%, #000); background: color-mix(in srgb, var(--c) 82%, #000); color: #fff; box-shadow: 0 3px 0 color-mix(in srgb, var(--c) 55%, #000); }

  textarea { width: 100%; min-height: 110px; border: 2px solid #3d2a14; border-radius: 14px; padding: 12px; font-family: inherit; font-size: 15px; color: #3d2a14; resize: vertical; background: #fff; }
  textarea:focus, input:focus { outline: 3px solid #E8B93A; }
  input[type=password], input[type=number] { border: 2px solid #3d2a14; border-radius: 12px; padding: 10px; font-family: inherit; font-size: 20px; width: 110px; text-align: center; min-height: 48px; }

  button { font-family: inherit; }
  .btn { min-height: 56px; border-radius: 28px; border: 0; background: #B05A0C; color: #fff; font-size: 17px; font-weight: 800; padding: 0 20px; box-shadow: 0 4px 0 #7a3e06; cursor: pointer; width: 100%; margin-top: 12px; }
  .btn:disabled { background: #b8a98c; box-shadow: none; cursor: not-allowed; }
  .btn.sec { background: #fff; color: #3d2a14; border: 2px solid #3d2a14; box-shadow: none; min-height: 50px; font-size: 15px; }
  .btn.no { background: #FDE3DD; color: #8a2414; border: 2px solid #A8321F; box-shadow: none; min-height: 50px; font-size: 15px; }
  .btn.g { background: #2c6347; box-shadow: 0 4px 0 #1d4a33; min-height: 48px; font-size: 15px; width: auto; margin: 0; }
  .tri { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
  .tri button { min-height: 56px; border-radius: 14px; border: 2px solid #3E7F5D; background: #E3F1E8; color: #1d4a33; font-size: 14px; font-weight: 800; cursor: pointer; }
  .att { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 6px 0 12px; border-radius: 18px; background: #FFF1C9; border: 1px solid #CD9A0D; font-size: 13px; margin: 8px 6px 0 0; }
  .att button { border: 0; background: #E8B93A; border-radius: 14px; min-height: 28px; font-weight: 800; cursor: pointer; }
  .link { background: none; border: 0; color: #5a4a36; font-size: 14px; padding: 12px; text-decoration: underline; font-weight: 700; cursor: pointer; }
  .badge { display: inline-block; color: #fff; font-weight: 800; border-radius: 999px; padding: 4px 14px; font-size: 13px; }

  .prog { height: 12px; border-radius: 6px; background: #e6dcc3; margin: 16px 0 8px; overflow: hidden; }
  .prog div { height: 100%; background: #E8B93A; transition: width .4s; }
  .dial { width: 230px; height: 230px; border-radius: 50%; border: 14px solid #E8B93A; background: #fff; margin: 22px auto; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .dial b { font-size: 54px; }

  /* riassunto (schermo e stampa) */
  .doc { --cd: #2E8B57; }
  .dint { background: #FFF1C9; border-radius: 14px; padding: 12px 14px; font-size: 14.5px; line-height: 1.45; margin: 12px 0; }
  .dsez { background: var(--cd); color: #fff; border-radius: 12px; padding: 10px 14px; font-size: 17px; font-weight: 800; margin: 20px 0 10px; break-after: avoid; }
  .dp { font-size: 15.5px; line-height: 1.55; margin: 9px 0; break-inside: avoid; }
  .del { margin: 9px 0; font-size: 15.5px; line-height: 1.5; break-inside: avoid; }
  .del b.tt { display: block; margin-bottom: 4px; }
  .del div.v { display: flex; gap: 10px; margin: 3px 0; }
  .del i { width: 8px; height: 8px; border-radius: 4px; background: var(--cd); margin-top: 8px; flex: none; }
  .dtab { border: 2px solid #3d2a14; border-radius: 12px; overflow: hidden; background: #fff; margin: 12px 0; font-size: 14px; break-inside: avoid; }
  .dtab .r { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); border-top: 1px solid #d9c9a8; }
  .dtab .r > div { padding: 8px 10px; overflow-wrap: anywhere; }
  .dtab .r.h { background: var(--cd); color: #fff; font-weight: 800; border-top: 0; }
  .dtab .r:nth-child(even):not(.h) { background: #F3EBD6; }
  .datt { background: #FDE3DD; border: 2px solid #A8321F; border-radius: 12px; padding: 12px 14px; font-size: 14.5px; line-height: 1.45; margin: 12px 0; break-inside: avoid; }
  .datt b { color: #8a2414; display: block; }
  .dnote { background: #E8EEF5; border: 2px dashed #5B6B7A; border-radius: 12px; padding: 12px 14px; font-size: 14px; line-height: 1.45; margin: 16px 0; break-inside: avoid; }
  .dst { background: #E3F1E8; border-radius: 12px; padding: 12px 14px; font-size: 14.5px; line-height: 1.45; margin: 12px 0; break-inside: avoid; }
  .dnote ul { margin: 6px 0 0; padding-left: 18px; }
  .stick { position: sticky; bottom: 0; background: #FBF6EA; border-top: 2px solid #3d2a14; padding: 10px 18px 14px; margin: 18px -18px -18px; }
  .stick .btn { margin-top: 8px; }

  .modal { position: fixed; inset: 0; background: rgba(61,42,20,.55); display: flex; align-items: center; justify-content: center; padding: 14px; z-index: 10; }
  .modalbox { background: #FBF6EA; border: 3px solid #3d2a14; border-radius: 16px; width: 100%; max-width: 420px; overflow: hidden; }
  .mhead { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #3d2a14; color: #fff; font-size: 17px; }
  .mhead .ib { width: 40px; height: 40px; }
  #mbody { padding: 14px; }
  #mbody .card { margin: 10px 0 0; padding: 12px; }


  /* mappa concettuale A4 (stile dei fogli di Eli) */
  @page mappa { size: A4; margin: 0; }
  .mp-wrap { overflow: hidden; margin: 10px auto; }
  .mp-page { --m: #2E8B57; --ml: color-mix(in srgb, var(--m) 14%, #fff); width: 794px; height: 1123px; background: #FBF6EA; color: #173D2A; padding: 38px 42px; overflow: hidden; display: flex; flex-direction: column; transform-origin: top left; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; }
  .mp-page [contenteditable]:focus { outline: 2px dashed #CD9A0D; outline-offset: 1px; }
  .mp-banner { background: var(--m); color: #fff; text-align: center; border-radius: 10px; padding: 10px 12px; font-size: 22px; font-weight: 800; letter-spacing: 1px; }
  .mp-badges { text-align: center; margin: 8px 0 4px; }
  .mp-badge { display: inline-block; background: #CD9A0D; color: #fff; font-weight: 800; border-radius: 999px; padding: 3px 16px; font-size: 13px; margin: 0 4px; }
  .mp-badge.d { background: #E8B93A; color: #3a2d00; }
  .mp-page h1 { text-align: center; font-size: 31px; color: var(--m); margin: 6px 0 4px; border-bottom: 3px solid var(--m); padding-bottom: 8px; }
  .mp-g2, .mp-g4 { display: grid; gap: 10px; margin-top: 14px; }
  .mp-g2 { grid-template-columns: 1fr 1fr; } .mp-g4 { grid-template-columns: repeat(4, 1fr); }
  .mp-box { background: #fff; border: 2px solid #CD9A0D; border-radius: 10px; overflow: hidden; }
  .mp-box h3 { margin: 0; background: #E8B93A; color: #3a2d00; font-size: 13.5px; padding: 6px 10px; display: flex; align-items: center; gap: 6px; text-transform: uppercase; letter-spacing: .5px; }
  .mp-box h3 svg { width: 20px; height: 20px; flex: none; }
  .mp-box .b { padding: 9px 11px; font-size: 14.5px; line-height: 1.45; }
  .mp-box.red { border-color: #D9553F; } .mp-box.red h3 { background: #D9553F; color: #fff; }
  .mp-box.green { border-color: var(--m); } .mp-box.green h3 { background: var(--m); color: #fff; }
  .mp-box ul { margin: 0; padding-left: 16px; } .mp-box li { margin-bottom: 2px; }
  .mp-flow { display: grid; grid-template-columns: 1fr 26px 1fr 26px 1fr; align-items: stretch; margin-top: 14px; }
  .mp-arrow { display: flex; align-items: center; justify-content: center; font-size: 26px; color: #CD9A0D; font-weight: 800; }
  .mp-ex { background: var(--ml); border-radius: 6px; padding: 4px 8px; margin: 4px 0; font-weight: 700; }
  .mp-chain { background: var(--ml); border: 2px solid var(--m); border-radius: 10px; text-align: center; padding: 11px; font-size: 17px; font-weight: 800; margin-top: 14px; }
  .mp-key { display: inline-block; border: 2px solid #CD9A0D; background: #FFF3D0; border-radius: 8px; padding: 8px 16px; font-size: 20px; font-weight: 800; }
  .mp-foot { margin-top: auto; text-align: center; font-size: 11px; color: #6b7d7c; border-top: 1px solid #CD9A0D; padding-top: 6px; }
  .hub { display: grid; gap: 12px; }
  .th { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 10px 0; }
  .th > div { aspect-ratio: 16 / 9; border-radius: 8px; border: 2px solid #3d2a14; background: #fff; overflow: hidden; display: flex; flex-direction: column; font-size: 11px; }
  .th b { background: var(--cd); color: #fff; padding: 5px 8px; font-size: 11px; }
  .th span { padding: 5px 8px; line-height: 1.35; }
  #stampa.pm { page: mappa; }
  @media print { #stampa .mp-page { transform: none !important; } }
  #stampa { display: none; }
  @media print {
    @page { size: A4; margin: 12mm; }
    body { background: #fff; }
    .app, .modal { display: none !important; }
    #stampa { display: block !important; }
    #stampa .ptit { font-size: 26px; margin: 4px 0 2px; }
  }
</style>
</head>
<body>
<div class="app">
  <div id="bar"></div>
  <main id="main">Carico…</main>
</div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Area adulto">
  <div class="modalbox">
    <div class="mhead"><b>Area adulto</b><button id="mclose" class="ib" aria-label="Chiudi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div id="mbody"></div>
  </div>
</div>
<div id="stampa"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="pptxgen.bundle.js"></script>
<script src="slide.js"></script>
<script>
(function () {
  'use strict';

  /* ---- Impostazioni (nessun segreto qui: la chiave dell'IA sta nel proxy) ---- */
  var CONFIG = {
    PROXY_URL: 'https://script.google.com/macros/s/AKfycbynxUWVqU46YhOA6So0diCQkU_UVvuwPh9VL5K6P56lLFO9geqCCwDsu8susA3qwRs0/exec',
    CLIENT_ID: '391770471090-hbrpdpb88g4het6gtrraas6bvbejjd9l.apps.googleusercontent.com'
  };
  var COLORI = {
    'Antologia': '#7B4B94', 'Aritmetica': '#7A4BB3', 'Francese': '#3CA0D8', 'Geografia': '#2E8B57',
    'Geometria': '#4F5BD5', 'Grammatica': '#2E6DA4', 'Inglese': '#2F5BB8', 'Letteratura': '#8C2F39',
    'Scienze': '#E8782A', 'Storia': '#1F6F6B', "Storia dell'arte": '#3F7D5A', 'Tecnologia': '#5B6B7A'
  };
  var MAX_ALLEGATI = 4;
  var ICONE = {
    indietro: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
    casa: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>'
  };

  function $(id) { return document.getElementById(id); }
  var main = $('main');

  function leggi(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
  function scrivi(k, v) { try { if (v == null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) {} }

  var idToken = leggi('idt');
  var tokenOra = Number(leggi('idt_t') || 0);
  var stato = null;
  var pinCorrente = null;
  var bozza = nuovaBozza();
  var gen = null;          // generazione del riassunto in corso
  var timerId = null;

  function nuovaBozza() { return { materia: null, testo: '', allegati: [] }; }
  function pad(n) { return ('00' + n).slice(-3); }
  function colore(m) { return COLORI[m] || '#2E8B57'; }

  /* ---- costruzione sicura degli elementi (nessun testo esterno diventa HTML) ---- */
  function h(tag, attrs) {
    var el = document.createElement(tag);
    var a = attrs || {};
    Object.keys(a).forEach(function (k) {
      if (k === 'class') el.className = a[k];
      else if (k.indexOf('on') === 0) el.addEventListener(k.slice(2), a[k]);
      else el.setAttribute(k, a[k]);
    });
    function aggiungi(c) {
      if (c == null || c === false) return;
      if (Array.isArray(c)) { c.forEach(aggiungi); return; }
      el.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
    }
    for (var i = 2; i < arguments.length; i++) aggiungi(arguments[i]);
    return el;
  }
  function svuota(el) { while (el.firstChild) el.removeChild(el.firstChild); }
  function iconaBtn(svg, etichetta, fn) {
    var b = h('button', { class: 'ib', 'aria-label': etichetta, onclick: fn });
    b.innerHTML = svg; // icone fisse scritte qui, mai testo esterno
    return b;
  }

  /* ---- barra in alto: indietro, titolo, home ---- */
  // o = { titolo, mat (colore materia), indietro: fn, home: fn, destra: elemento }
  function barra(o) {
    var b = $('bar');
    svuota(b);
    o = o || {};
    b.className = o.mat ? 'col' : '';
    b.style.setProperty('--b', o.mat ? 'color-mix(in srgb, ' + colore(o.mat) + ' 78%, #000)' : '#FBF6EA');
    if (o.indietro) b.appendChild(iconaBtn(ICONE.indietro, 'Indietro', o.indietro));
    if (o.logo) {
      var ic = h('i'); ic.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M8.5 13l2.5 2.5 4.5-5"/></svg>';
      b.appendChild(h('div', { class: 'logo' }, ic, 'Studio Ripasso'));
    } else {
      b.appendChild(h('div', { class: 't' }, o.titolo || ''));
    }
    if (o.destra) b.appendChild(o.destra);
    if (o.home) b.appendChild(iconaBtn(ICONE.casa, 'Home', o.home));
  }
  function mostra(el, opzioni) {
    if (timerId) { clearInterval(timerId); timerId = null; }
    barra(opzioni);
    svuota(main); main.appendChild(el);
    window.scrollTo(0, 0);
  }

  /* ---- comunicazione con il proxy ---- */
  function chiama(req) {
    req.idToken = idToken;
    return fetch(CONFIG.PROXY_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(req)
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.error === 'non_autorizzato') throw { codice: 'auth' };
      return j;
    });
  }

  function caricaStato() {
    return chiama({ task: 'stato' }).then(function (j) {
      if (!j || !j.ok) throw { codice: 'errore' };
      stato = j;
    });
  }

  /* ---- accesso con Google ---- */
  var googlePronto = false;

  function attendiGoogle() {
    return new Promise(function (ok) {
      var t0 = Date.now();
      (function ciclo() {
        if (window.google && window.google.accounts && window.google.accounts.id) return ok(true);
        if (Date.now() - t0 > 10000) return ok(false);
        setTimeout(ciclo, 100);
      })();
    });
  }

  function avviaGoogle() {
    window.google.accounts.id.initialize({
      client_id: CONFIG.CLIENT_ID, callback: alleCredenziali,
      auto_select: true, cancel_on_tap_outside: false
    });
    googlePronto = true;
  }

  function alleCredenziali(risposta) {
    idToken = risposta.credential;
    tokenOra = Date.now();
    scrivi('idt', idToken);
    scrivi('idt_t', String(tokenOra));
    main.textContent = 'Carico…';
    caricaStato().then(mostraHome).catch(function (e) { gestisciErrore(e, true); });
  }

  function schermataLogin(messaggio) {
    var box = h('div', { class: 'card center' },
      h('h1', {}, 'Ciao!'),
      h('p', {}, 'Entra con il tuo account Google per studiare.'),
      messaggio ? h('p', { class: 'err' }, messaggio) : null,
      h('div', { id: 'gbtn', style: 'display:flex;justify-content:center;margin-top:10px' }));
    mostra(box, { logo: true });
    if (googlePronto) {
      window.google.accounts.id.renderButton($('gbtn'),
        { theme: 'filled_blue', size: 'large', text: 'signin_with', locale: 'it' });
    } else {
      $('gbtn').appendChild(h('p', { class: 'err' }, 'Non riesco a caricare l\'accesso Google. Controlla internet e ricarica la pagina.'));
    }
  }

  function gestisciErrore(e, appenaEntrato) {
    if (e && e.codice === 'auth') {
      var scaduto = !appenaEntrato && (Date.now() - tokenOra > 50 * 60000);
      idToken = null; scrivi('idt', null); scrivi('idt_t', null);
      schermataLogin(scaduto ? 'La sessione è scaduta: accedi di nuovo.'
        : 'Questo account non è autorizzato a usare l\'app.');
      return;
    }
    mostra(h('div', { class: 'card center' },
      h('p', { class: 'err' }, 'Non riesco a collegarmi. Controlla internet e riprova.'),
      h('button', { class: 'btn', onclick: function () { main.textContent = 'Carico…'; avvio(); } }, 'Riprova')),
      { logo: true });
  }

  function esci() {
    idToken = null; scrivi('idt', null); scrivi('idt_t', null);
    stato = null; gen = null;
    if (googlePronto) window.google.accounts.id.disableAutoSelect();
    schermataLogin();
  }

  /* ---- home: nuovo argomento oppure argomento in corso ---- */
  function mostraHome() {
    var esciBtn = h('button', { class: 'link', onclick: esci }, 'Esci');
    var opz = { logo: true, destra: esciBtn };
    var pieDiPagina = h('div', { class: 'center' },
      h('button', { class: 'link', onclick: apriAdulto }, 'Area adulto'));

    if (stato && stato.aperto) {
      var a = stato.aperto;
      var c = h('div', { class: 'card' },
        h('span', { class: 'badge', style: 'background:' + colore(a.materia) }, a.materia + ' · Mappa ' + pad(a.numero)),
        h('h1', {}, a.titolo),
        h('p', {}, { pausa: 'Sei in pausa di studio.', card: 'Le card di ripasso ti aspettano.',
          sbloccato: 'Hai finito tutte le card!' }[a.stato] || 'Hai un argomento in corso.'),
        h('button', { class: 'btn', onclick: continuaArgomento }, 'Continua'));
      mostra(h('div', {}, h('p', {}, 'Ciao! Finisci questo argomento prima di iniziarne un altro.'), c, pieDiPagina), opz);
      return;
    }

    var griglia = h('div', { class: 'mat' });
    Object.keys(COLORI).forEach(function (m) {
      griglia.appendChild(h('button', { class: 'm' + (bozza.materia === m ? ' on' : ''), style: '--c:' + COLORI[m],
        onclick: function () {
          bozza.materia = m;
          Array.prototype.forEach.call(griglia.children, function (b) { b.classList.toggle('on', b.textContent === m); });
        } }, m));
    });

    var txt = h('textarea', { placeholder: 'Scrivi o incolla qui il testo da studiare…' });
    txt.value = bozza.testo;
    txt.addEventListener('input', function () { bozza.testo = txt.value; });

  function continuaArgomento() {
    var st = stato.aperto.stato;
    if (st === 'pausa') mostraPausa();
    else if (st === 'card') mostraCard();
    else if (st === 'sbloccato') mostraSbloccato();
    else mostraRiassunto();
  }

  function mostraMsg(msg, testo) {
    msg.textContent = testo;
    msg.classList.toggle('hidden', !testo);
  }

  /* ---- foto e file ---- */
  function leggiFile(file) {
    return new Promise(function (ok, ko) {
      if (file.type === 'application/pdf') {
        if (file.size > 5 * 1024 * 1024) { ko('Il PDF è troppo grande (massimo 5 MB).'); return; }
        var fr = new FileReader();
        fr.onload = function () { ok({ mime: 'application/pdf', data: String(fr.result).split(',')[1], nome: file.name }); };
        fr.onerror = function () { ko('Non riesco a leggere il file.'); };
        fr.readAsDataURL(file);
      } else if (file.type.indexOf('image/') === 0) {
        var img = new Image();
        var url = URL.createObjectURL(file);
        img.onload = function () {
          var max = 1800, w = img.width, hh = img.height;
          var s = Math.min(1, max / Math.max(w, hh));
          w = Math.round(w * s); hh = Math.round(hh * s);
          var c = document.createElement('canvas');
          c.width = w; c.height = hh;
          c.getContext('2d').drawImage(img, 0, 0, w, hh);
          URL.revokeObjectURL(url);
          ok({ mime: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.82).split(',')[1], nome: file.name || 'foto' });
        };
        img.onerror = function () { ko('Non riesco a leggere l\'immagine.'); };
        img.src = url;
      } else {
        ko('Formato non supportato: usa foto o PDF.');
      }
    });
  }

  function aggiungiFile(input, lista, msg) {
    var files = Array.prototype.slice.call(input.files || []);
    input.value = '';
    mostraMsg(msg, '');
    files.reduce(function (p, f) {
      return p.then(function () {
        if (bozza.allegati.length >= MAX_ALLEGATI) throw 'Puoi caricare al massimo ' + MAX_ALLEGATI + ' file.';
        return leggiFile(f).then(function (a) { bozza.allegati.push(a); });
      });
    }, Promise.resolve()).catch(function (e) {
      mostraMsg(msg, typeof e === 'string' ? e : 'Non riesco a leggere il file.');
    }).then(function () { disegnaAllegati(lista); });
  }

  function disegnaAllegati(lista) {
    svuota(lista);
    bozza.allegati.forEach(function (a, i) {
      lista.appendChild(h('span', { class: 'att' }, a.nome,
        h('button', { 'aria-label': 'Togli ' + a.nome, onclick: function () { bozza.allegati.splice(i, 1); disegnaAllegati(lista); } }, 'togli')));
    });
  }

  /* ---- dettatura (Chrome su Android e Windows) ---- */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null, inAscolto = false;

  function dettatura(btn, txt, micMsg) {
    if (!SR) { micMsg.textContent = 'Dettatura non supportata da questo browser: usa Chrome.'; return; }
    if (inAscolto) { rec.stop(); return; }
    rec = new SR();
    rec.lang = 'it-IT'; rec.continuous = true; rec.interimResults = false;
    rec.onresult = function (e) {
      for (var i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) {
          txt.value += (txt.value && ' ') + e.results[i][0].transcript;
          bozza.testo = txt.value;
        }
      }
    };
    rec.onstart = function () { inAscolto = true; btn.textContent = 'Stop'; micMsg.textContent = 'Sto ascoltando…'; };
    rec.onend = function () { inAscolto = false; btn.textContent = 'Detta'; micMsg.textContent = ''; };
    rec.onerror = function () { micMsg.textContent = 'Microfono non disponibile o permesso negato.'; };
    rec.start();
  }

  /* ---- generazione del riassunto: indice, poi una sezione alla volta ---- */
  function materiale() {
    return { materia: gen.materia, testo: gen.testo,
      immagini: gen.allegati.map(function (a) { return { mime: a.mime, data: a.data }; }) };
  }

  function avviaGenerazione(msg) {
    mostraMsg(msg, '');
    if (!bozza.materia) { mostraMsg(msg, 'Scegli prima la materia.'); return; }
    var testo = bozza.testo.trim();
    if (!testo && !bozza.allegati.length) { mostraMsg(msg, 'Scrivi, detta o carica qualcosa da studiare.'); return; }
    gen = { materia: bozza.materia, testo: testo, allegati: bozza.allegati.slice(), indice: null, sezioni: [], errori: 0 };
    avanza();
  }

  function schermataGenera(testoStato, perc, errore) {
    var corpo = h('div', { class: 'card center' },
      h('h1', {}, 'Preparo il tuo riassunto'),
      h('p', {}, testoStato),
      h('div', { class: 'prog' }, h('div', { style: 'width:' + perc + '%' })),
      h('p', { class: 'small' }, 'Più il materiale è lungo, più ci vuole: resta qui finché non ho finito.'));
    if (errore) {
      corpo.appendChild(h('p', { class: 'err' }, errore.testo));
      if (errore.riprova) corpo.appendChild(h('button', { class: 'btn', onclick: avanza }, 'Riprova'));
      corpo.appendChild(h('button', { class: 'btn sec', onclick: function () { gen = null; mostraHome(); } }, 'Torna indietro'));
    }
    mostra(corpo, { titolo: gen.materia + ' · riassunto', mat: gen.materia });
  }

  function erroreGen(j) {
    var tot = gen.indice ? gen.indice.sezioni.length : 0;
    var perc = tot ? Math.round(100 * gen.sezioni.length / (tot + 1)) : 3;
    if (j && (j.blocked || j.error === 'limite_giornaliero')) {
      schermataGenera('Non posso andare avanti.', perc, { testo: j.messaggio, riprova: false });
    } else if (j && j.error === 'argomento_aperto') {
      gen = null; caricaStato().then(mostraHome);
    } else {
      schermataGenera('Qualcosa non ha funzionato.', perc,
        { testo: 'Riprova: il lavoro già fatto non va perso.', riprova: true });
    }
  }

  function avanza() {
    if (!gen) return;
    var passo;
    var tot = gen.indice ? gen.indice.sezioni.length : 0;
    if (!gen.indice) {
      schermataGenera('Leggo il materiale e preparo l\'indice…', 3);
      passo = chiama(Object.assign({ task: 'indice' }, materiale())).then(function (j) {
        if (!j.ok) throw j;
        gen.indice = j;
      });
    } else if (gen.sezioni.length < tot) {
      var n = gen.sezioni.length + 1;
      schermataGenera('Scrivo la parte ' + n + ' di ' + tot + ': ' + gen.indice.sezioni[n - 1].titolo,
        Math.round(100 * (n - 1) / (tot + 1)) + 5);
      passo = chiama(Object.assign({ task: 'sezione', numero: n,
        indice: gen.indice.sezioni.map(function (s) { return s.titolo; }) }, materiale())).then(function (j) {
        if (!j.ok) throw j;
        gen.sezioni.push(j.sezione);
      });
    } else {
      schermataGenera('Salvo il riassunto…', 97);
      passo = chiama({ task: 'chiudi_riassunto', materia: gen.materia, titolo: gen.indice.titolo,
        introduzione: gen.indice.introduzione, come_studiare: gen.indice.come_studiare,
        sezioni: gen.sezioni }).then(function (j) {
        if (!j.ok) throw j;
        stato.aperto = j.argomento; gen = null; bozza = nuovaBozza(); mostraRiassunto();
      });
    }
    passo.then(function () { if (gen) avanza(); }).catch(function (e) {
      if (e && e.codice === 'auth') { gestisciErrore(e, false); return; }
      erroreGen(e);
    });
  }

  /* ---- disegno del riassunto (stesso per schermo e per stampa) ---- */
  function leggiDoc(a) {
    try {
      var d = JSON.parse(a.riassunto);
      if (d && Array.isArray(d.sezioni)) return d;
    } catch (e) {}
    return { titolo: a.titolo, introduzione: '', come_studiare: '', sezioni: [{ titolo: 'Riassunto', blocchi:
      String(a.riassunto || '').split(/\n+/).filter(function (p) { return p.trim(); })
        .map(function (p) { return { tipo: 'paragrafo', testo: p }; }), note: [] }] };
  }

  function disegnaDoc(doc, materia) {
    var d = h('div', { class: 'doc', style: '--cd:color-mix(in srgb, ' + colore(materia) + ' 82%, #000)' });
    if (doc.introduzione) d.appendChild(h('div', { class: 'dint' }, h('b', {}, 'Per studiare: '), doc.introduzione));
    var note = [];
    doc.sezioni.forEach(function (s) {

          b.voci.forEach(function (v) { e.appendChild(h('div', { class: 'v' }, h('i'), h('span', {}, v))); });
          d.appendChild(e);

          t.appendChild(h('div', { class: 'r h' }, b.colonne.map(function (c) { return h('div', {}, c); })));

  /* ---- pausa di studio ---- */
  function mostraPausa() {
    var a = stato.aperto;
    var scarto = (a.adesso || Date.now()) - Date.now(); // orologio del server meno il mio
    var tempo = h('b', {}, '--:--');
    var etich = h('div', { class: 'small' }, 'minuti rimasti');
    var avviso = h('p', {}, 'Chiudi il libro e fai qualcos\'altro. Quando il tempo finisce arrivano le card di ripasso.');
    var vai = h('button', { class: 'btn', disabled: 'disabled', onclick: function () { avviaCard(vai, avviso); } },
      'Le card si aprono alla fine');
    var corpo = h('div', { class: 'center' },
      h('h1', {}, 'Pausa di studio'), h('div', { class: 'dial' }, tempo, etich), avviso, vai);
    mostra(corpo, { titolo: a.materia + ' · Mappa ' + pad(a.numero), mat: a.materia, indietro: mostraHome });
    function giro() {
      var resto = Math.max(0, Math.round((a.pausaFine - (Date.now() + scarto)) / 1000));
      if (resto > 0) {
        tempo.textContent = ('0' + Math.floor(resto / 60)).slice(-2) + ':' + ('0' + (resto % 60)).slice(-2);
      } else {
        tempo.textContent = '00:00'; etich.textContent = 'tempo finito';
        avviso.textContent = 'Pausa finita! Sei pronto per le card di ripasso.';
        vai.disabled = false; vai.textContent = 'Inizia le card';
        clearInterval(timerId); timerId = null;
      }
    }
    giro();
    timerId = setInterval(giro, 1000);
  }

      msg.className = 'err'; msg.textContent = j.messaggio || 'Non sono riuscito a preparare le card. Riprova.';
    }).catch(function (e) {

    orologio: '<svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8" fill="#fff" stroke="#3a2d00" stroke-width="2"/><path d="M12 8v5l3 2" fill="none" stroke="#3a2d00" stroke-width="2" stroke-linecap="round"/><rect x="10" y="2" width="4" height="3" fill="#3a2d00"/></svg>'
  };

  // testo modificabile con limite di lunghezza (la cornice non si sposta)
  function ed(tag, testo, max, attrs) {
    var el = h(tag, attrs || {}, testo);
    el.setAttribute('contenteditable', 'plaintext-only');
    el.setAttribute('spellcheck', 'false');
    var tetto = Math.round(max * 1.3);
    el.addEventListener('beforeinput', function (e) {
      if (e.inputType === 'insertParagraph' || e.inputType === 'insertLineBreak') { e.preventDefault(); return; }
      if (e.inputType && e.inputType.indexOf('insert') === 0 && el.textContent.length >= tetto) e.preventDefault();
    });
    return el;
  }
  function riquadro(titolo, icona, corpo, cls) {
    var t = h('h3', {}, h('span', { style: 'display:contents' }), titolo);
    t.firstChild.innerHTML = icona; // icone fisse del programma
    var r = h('div', { class: 'mp-box ' + (cls || '') }, t, h('div', { class: 'b' }, corpo));
    return r;
  }
  function elenco(voci, max) {
    var u = h('ul', {});
    voci.forEach(function (v) { u.appendChild(ed('li', v, max)); });
    return u;
  }

  function mappaDom(m, materia, numero) {
    var p = h('div', { class: 'mp-page', style: '--m:color-mix(in srgb, ' + colore(materia) + ' 82%, #000)' });
    var M = materia.toUpperCase();
    p.appendChild(h('div', { class: 'mp-banner' }, 'LA MAPPA DI ' + M));
    p.appendChild(h('div', { class: 'mp-badges' }, h('span', { class: 'mp-badge' }, 'MAPPA ' + pad(numero)),
      ed('span', M + ' · ' + m.tema.toUpperCase(), 50, { class: 'mp-badge d' })));
    p.appendChild(ed('h1', m.titolo, 60));
    p.appendChild(h('div', { class: 'mp-g2' },
      riquadro('Concetto chiave', IC.lente, ed('div', m.concetto_chiave, 230)),
      riquadro('Idea centrale', IC.lampada, ed('div', m.idea_centrale, 230))));
    var g4 = h('div', { class: 'mp-g4' });
    m.elementi.forEach(function (e, i) {
      g4.appendChild(riquadro(e.titolo, ICONE_MAPPA[i % 4], ed('div', e.testo, 100)));
    });
    p.appendChild(g4);
    var ex = h('div', {});
    m.effetto.forEach(function (x) { ex.appendChild(ed('div', x, 40, { class: 'mp-ex' })); });
    p.appendChild(h('div', { class: 'mp-flow' },
      riquadro('Causa', '', elenco(m.causa, 70), 'green'), h('div', { class: 'mp-arrow' }, '➜'),
      riquadro('Effetto', '', ex, 'green'), h('div', { class: 'mp-arrow' }, '➜'),
      riquadro('Conseguenza', '', elenco(m.conseguenza, 70), 'green')));
    p.appendChild(ed('div', m.formula, 90, { class: 'mp-chain' }));
    p.appendChild(h('div', { class: 'mp-g2' },
      riquadro('Occhio alla trappola', IC.trappola, ed('div', m.trappola, 220), 'red'),
      riquadro('Come te lo chiede la prof', IC.prof, h('div', {}, ed('span', '«' + m.domanda + '»', 130), h('br'),
        ed('i', m.suggerimento, 130)))));
    p.appendChild(h('div', { class: 'mp-g2' },
      riquadro('Parola chiave', IC.chiave, h('div', { style: 'text-align:center;padding:10px 6px' }, ed('span', m.parola_chiave, 24, { class: 'mp-key' }))),
      riquadro('Ricorda al volo', IC.orologio, elenco(m.ricorda, 55))));
    p.appendChild(h('div', { class: 'mp-foot' }, materia + ' · ' + m.tema + ' · Mappa ' + pad(numero)));
    return p;
  }

  function mostraMappa() {
    var a = stato.aperto, m = a.sblocco.mappa;
    var pagina = mappaDom(m, a.materia, a.numero);
    var larg = Math.min(main.clientWidth || 600, 794);
    var sc = Math.min(1, (larg - 36) / 794);
    pagina.style.transform = 'scale(' + sc + ')';
    var wrap = h('div', { class: 'mp-wrap', style: 'width:' + Math.round(794 * sc) + 'px;height:' + Math.round(1123 * sc) + 'px' }, pagina);
    var pdf = h('button', { class: 'btn', onclick: function () {
      var s = $('stampa'); svuota(s); s.className = 'pm';
      var copia = pagina.cloneNode(true);
      copia.style.transform = 'none';
      Array.prototype.forEach.call(copia.querySelectorAll('[contenteditable]'), function (x) { x.removeAttribute('contenteditable'); });
      s.appendChild(copia);
      var v = document.title; document.title = a.materia + ' ' + pad(a.numero) + ' - Mappa';
      window.print(); document.title = v; s.className = '';
    } }, 'Scarica il PDF (A4)');
    mostra(h('div', {},
      h('p', { class: 'small' }, 'Tocca un testo per modificarlo. Pizzica per ingrandire. La cornice resta ferma.'),
      wrap, pdf),
      { titolo: a.materia + ' · Mappa ' + pad(a.numero), mat: a.materia, indietro: mostraSbloccato, home: mostraHome });
  }

  /* ---- slide ---- */
  function righeAnteprima(d) {
    var r = [{ t: d.titolo, r: [d.sottotitolo] }, { t: 'Il quadro generale', r: [d.centro + ': ' + d.nodi.join(', ')] }];
    d.colonne.forEach(function (c) { r.push({ t: c.titolo_slide, r: [c.a.titolo + ': ' + c.a.voci[0], c.b.titolo + ': ' + c.b.voci[0]] }); });
    r.push({ t: d.numero.titolo, r: [d.numero.valore + ' ' + d.numero.etichetta, d.numero.testo] });
    r.push({ t: 'Da ricordare', r: d.ricorda });
    return r;
  }

  function mostraSlide() {
    var a = stato.aperto, d = a.sblocco.slide;
    var th = h('div', { class: 'th', style: '--cd:color-mix(in srgb, ' + colore(a.materia) + ' 82%, #000)' });
    righeAnteprima(d).forEach(function (x, i) {
      th.appendChild(h('div', {}, h('b', {}, (i + 1) + ' · ' + x.t), h('span', {}, x.r.join(' · '))));
    });
    var msg = h('p', { class: 'err hidden' });
    var dl = h('button', { class: 'btn', onclick: function () {
      mostraMsg(msg, '');
      if (!window.PptxGenJS || !window.ripassoSlide) { mostraMsg(msg, 'Non riesco a creare il file. Ricarica la pagina.'); return; }
      dl.disabled = true;
      var P = window.ripassoSlide.costruisci(window.PptxGenJS, d, a.materia, a.numero, colore(a.materia));
      P.write({ outputType: 'blob' }).then(function (blob) {
        var url = URL.createObjectURL(blob);
        var l = h('a', { href: url, download: a.materia + ' ' + pad(a.numero) + ' - slide.pptx' });
        document.body.appendChild(l); l.click(); document.body.removeChild(l);
        setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
        dl.disabled = false;
      }).catch(function () { dl.disabled = false; mostraMsg(msg, 'Non sono riuscito a creare il file. Riprova.'); });
    } }, 'Scarica le slide (.pptx)');
    mostra(h('div', {},
      h('h1', {}, 'Le tue slide'), th,
      h('p', { class: 'small' }, 'Nel file puoi modificare ogni testo. I colori sono quelli di ' + a.materia + '.'),
      dl, msg,
      h('div', { class: 'card' }, h('b', {}, 'Come aprirle in Canva'),
        h('p', {}, '1. Scarica il file .pptx. 2. Apri Canva e premi Crea un design, poi Importa file. 3. Scegli il file: ogni slide è modificabile.'))),
      { titolo: a.materia + ' · Mappa ' + pad(a.numero), mat: a.materia, indietro: mostraSbloccato, home: mostraHome });
  }

  /* ---- sblocco: mappa e slide ---- */
  function mostraSbloccato() {
    var a = stato.aperto;
    var opz = { titolo: a.materia + ' · Mappa ' + pad(a.numero), mat: a.materia, home: mostraHome };
    if (!a.sblocco) {
      var msg = h('p', { class: 'err hidden' });
      var crea = h('button', { class: 'btn', onclick: function () {
        crea.disabled = true; crea.textContent = 'Preparo mappa e slide…'; mostraMsg(msg, '');
        chiama({ task: 'sblocco_genera' }).then(function (j) {
          if (j.ok) { stato.aperto = j.argomento; mostraSbloccato(); return; }
          crea.disabled = false; crea.textContent = 'Crea mappa e slide';
          mostraMsg(msg, j.messaggio || 'Non sono riuscito a prepararle. Riprova.');
        }).catch(function (e) {
          if (e && e.codice === 'auth') { gestisciErrore(e, false); return; }
          crea.disabled = false; crea.textContent = 'Crea mappa e slide';
          mostraMsg(msg, 'Non riesco a collegarmi. Riprova.');
        });
      } }, 'Crea mappa e slide');
      mostra(h('div', { class: 'center' }, h('h1', {}, 'Bravo!'),
        h('div', { class: 'dst' }, 'Hai risposto bene a tutte le card: si sbloccano la mappa concettuale e le slide.'),
        crea, msg), opz);
      return;
    }
    var fine = h('button', { class: 'btn no', onclick: function () {
      if (!window.confirm('Hai scaricato mappa e slide? Poi potrai iniziare un nuovo argomento.')) return;
      chiama({ task: 'chiudi_argomento' }).then(function (j) {
        if (j.ok) { stato.aperto = null; bozza = nuovaBozza(); mostraHome(); }
      }).catch(function (e) { if (e && e.codice === 'auth') gestisciErrore(e, false); });
    } }, 'Ho finito: nuovo argomento');
    mostra(h('div', {}, h('h1', {}, 'Mappa e slide pronte'),
      h('div', { class: 'card' }, h('b', {}, 'Mappa concettuale (A4)'), h('p', { class: 'small' }, 'Si può modificare e salvare in PDF.'),
        h('button', { class: 'btn', onclick: mostraMappa }, 'Apri la mappa')),
      h('div', { class: 'card' }, h('b', {}, 'Slide per l\'esposizione'), h('p', { class: 'small' }, 'File .pptx da aprire in Canva o PowerPoint.'),
        h('button', { class: 'btn', onclick: mostraSlide }, 'Apri le slide')),
      fine), opz);
  }

  /* ---- area adulto ---- */
  function testoErrorePin(j) {
    if (j.error === 'pin_errato') return 'PIN errato. Tentativi rimasti: ' + j.rimasti + '.';
    if (j.error === 'bloccato') return 'Troppi tentativi. Riprova tra ' + j.minuti + ' minuti.';
    if (j.error === 'pin_non_impostato') return 'Il PIN non è ancora impostato nel proxy.';
    if (j.error === 'valore_non_valido') return 'Valore non valido.';
    return 'Operazione non riuscita.';
  }

  function apriAdulto() {
    if (!idToken) return;
    pinCorrente = null;
    $('modal').classList.remove('hidden');
    schermataPin();
  }
  function chiudiAdulto() {
    pinCorrente = null;
    $('modal').classList.add('hidden');
    svuota($('mbody'));
  }

  function schermataPin() {
    var corpo = $('mbody');
    svuota(corpo);
    var pin = h('input', { type: 'password', inputmode: 'numeric', maxlength: '8', 'aria-label': 'PIN' });
    var msg = h('p', { class: 'err hidden' });
    var ok = h('button', { class: 'btn g', onclick: function () {
      ok.disabled = true;
      chiama({ task: 'adulto_verifica', pin: pin.value }).then(function (j) {
        ok.disabled = false;
        if (j.ok) { pinCorrente = pin.value; schermataPannello(); return; }
        mostraMsg(msg, testoErrorePin(j));
      }).catch(function (e) {
        ok.disabled = false;
        if (e && e.codice === 'auth') { chiudiAdulto(); gestisciErrore(e, false); return; }
        mostraMsg(msg, 'Non riesco a collegarmi.');
      });
    } }, 'Entra');
    pin.addEventListener('keydown', function (e) { if (e.key === 'Enter') ok.click(); });
    corpo.appendChild(h('p', {}, 'Inserisci il PIN.'));
    corpo.appendChild(h('div', { style: 'display:flex;gap:10px;align-items:center' }, pin, ok));
    corpo.appendChild(msg);
    setTimeout(function () { pin.focus(); }, 50);
  }

  function schermataPannello() {
    var corpo = $('mbody');
    svuota(corpo);
    var msg = h('p', { class: 'small' });
    var minuti = h('input', { type: 'number', min: '1', max: '120', value: String(stato.timerMin) });
    var salva = h('button', { class: 'btn g', onclick: function () {
      chiama({ task: 'timer_imposta', pin: pinCorrente, minuti: Number(minuti.value) }).then(function (j) {
        if (j.ok) { stato.timerMin = j.timerMin; msg.className = 'okc'; msg.textContent = 'Timer salvato: ' + j.timerMin + ' minuti.'; return; }
        msg.className = 'err'; msg.textContent = testoErrorePin(j);
      }).catch(function () { msg.className = 'err'; msg.textContent = 'Non riesco a collegarmi.'; });
    } }, 'Salva');
    corpo.appendChild(h('div', { class: 'card' }, h('b', {}, 'Tempo di pausa prima delle card'),
      h('div', { style: 'display:flex;gap:10px;align-items:center;margin-top:10px' }, minuti, 'minuti', salva)));

    if (stato.aperto) {
      corpo.appendChild(h('div', { class: 'card' }, h('b', {}, 'Argomento in corso'),
        h('p', {}, stato.aperto.materia + ' ' + pad(stato.aperto.numero) + ' – ' + stato.aperto.titolo),
        h('button', { class: 'btn no', onclick: function () {
          if (!window.confirm('Annullare questo argomento? Il ragazzo potrà iniziarne un altro.')) return;
          chiama({ task: 'annulla_argomento', pin: pinCorrente }).then(function (j) {
            if (j.ok) { stato.aperto = null; chiudiAdulto(); mostraHome(); return; }
            msg.className = 'err'; msg.textContent = testoErrorePin(j);
          }).catch(function () { msg.className = 'err'; msg.textContent = 'Non riesco a collegarmi.'; });
        } }, 'Annulla argomento')));
    }
    corpo.appendChild(msg);
  }

  /* ---- avvio ---- */
  function avvio() {
    attendiGoogle().then(function (ok) {
      if (ok && !googlePronto) avviaGoogle();
      if (idToken) {
        return caricaStato().then(mostraHome).catch(function (e) {
          if (e && e.codice === 'auth') { idToken = null; scrivi('idt', null); schermataLogin(); }
          else gestisciErrore(e, false);
        });
      }
      schermataLogin();
    });
  }

  $('mclose').addEventListener('click', chiudiAdulto);

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
  avvio();
})();
</script>
</body>
</html>
